<!DOCTYPE html>
<html>
 <head>
 <title>Title of the document</title>
 <style>
 body {
   background-color: #262447; /* Dark background color from your screenshot */
   color: #ffffff;
   margin: 0;
   padding: 40px 20px;
   font-family: Arial, sans-serif;
 }

 #defaultBlock {
   display: table;
   margin: 0 auto; /* Centers layout horizontally */
 }

 div {
   float: left;
   height: 600px; /* Equal height for all 3 blocks */
   width: 300px;  /* Equal width for all 3 blocks */
   padding: 10px;
   box-sizing: border-box; /* Ensures padding stays inside the 300px width */
 }

 #block1 {
   background-color: #F54927;
 }

 #block2 {
   background-color: #304373;
 }

 #block3 {
   background-color: #5F93F5;
 }

 h2 {
   text-align: center;
   margin-top: 10px;
 }
 </style>
 </head>
 <body>
 <main id="defaultBlock">
   <h2>SnowShady</h2>
   <div id="block1">
     <h2>Until CHhrismas</h2>
     
       <iframe style="width:100%;max-width:360px;height:360px;"
                    src="https://stopwatch-app.com/widget/countdown?theme=dark&color=red&title=Merry%20Christmas!&date=2026-12-25T00%3A00" 
                    frameborder="0"></iframe>
   </div>
   <div id="block2">
     <h2>World Clock</h2>
     <iframe style="width:100%;max-width:400px;height:360px;"
             src="https://stopwatch-app.com/widget/clock?theme=dark&color=indigo&format=12&city=ca%2Ftoronto" 
             frameborder="0"></iframe>
   </div>
   <div id="block3">
     <h2>The Weather</h2>
     <a class="weatherwidget-io" href="https://forecast7.com/en/43d65n79d38/toronto/" data-label_1="TORONTO" data-label_2="WEATHER" data-theme="original">TORONTO WEATHER</a>
     <script>
     !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
     </script>
   </div>
 </main>
 </body>
</html>
